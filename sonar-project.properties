sonar.projectKey=DoctorPok42_Trello
sonar.organization=doctorpok42
sonar.host.url=https://sonarcloud.io

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=Trello
#sonar.projectVersion=1.0

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8

sonar.sources=.
sonar.tests=__tests__
sonar.exclusions=**/*.test.tsx,**/*.test.ts
sonar.test.inclusions=__tests__/**/*.test.tsx,__tests__/**/*.test.ts
sonar.test.inclusions=__tests__/**/*.test.{ts,tsx}
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.verbose=true